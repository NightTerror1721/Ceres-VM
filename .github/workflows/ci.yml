name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything goes through the CMake presets. There used to be three separate sources of truth
# for which files make up the project - two hand-maintained .vcxproj files, tests/build.sh with
# globs, and a g++ line in here - and they drifted out of sync. Now CI builds exactly what gets
# built locally, with the same names.

jobs:
  # The usual toolchain. The msvc preset uses Ninja Multi-Config with cl, so it needs the dev
  # environment: vswhere locates it without pinning a Visual Studio version, which changes
  # whenever GitHub updates the runner image.
  msvc:
    name: MSVC (${{ matrix.config }})
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
        working-directory: Ceres
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: Debug,   preset: debug }
          - { config: Release, preset: release }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset msvc

      - name: Build
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build --preset msvc-${{ matrix.preset }}

      - name: Test
        run: ctest --preset msvc-${{ matrix.preset }}

      # Linking doesn't mean assembling. These two cover the whole path, and the second one
      # also exercises an `import` of the library in stdlib/.
      - name: Run the shipped examples
        run: |
          build\msvc\bin\${{ matrix.config }}\ceres.exe run examples\main.casm
          build\msvc\bin\${{ matrix.config }}\ceres.exe run examples\calling_convention.casm

  # A second compiler isn't redundant: four missing #includes went unnoticed while MSVC was
  # the only thing building this, because it supplies them transitively.
  gcc:
    name: GCC 15 (${{ matrix.config }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Ceres
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: Debug,   preset: debug }
          - { config: Release, preset: release }
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 15 and Ninja
        working-directory: .
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15 ninja-build

      # The preset sets CMAKE_CXX_COMPILER to g++, which on this runner is an older version;
      # the command line overrides the preset, so naming the one we want is enough.
      - name: Configure
        run: cmake --preset gcc -DCMAKE_CXX_COMPILER=g++-15

      - name: Build
        run: cmake --build --preset gcc-${{ matrix.preset }}

      - name: Test
        run: ctest --preset gcc-${{ matrix.preset }}

      - name: Run the shipped examples
        run: |
          ./build/gcc/bin/${{ matrix.config }}/ceres run examples/main.casm
          ./build/gcc/bin/${{ matrix.config }}/ceres run examples/calling_convention.casm
